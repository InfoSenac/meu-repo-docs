name: Publicar Documentacao MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache

      - name: Instalar MkDocs Material e Plugins
        run: |
          pip install mkdocs-material

      - name: Compilar e Publicar no GitHub Pages
        run: |
          mkdocs gh-deploy --force
